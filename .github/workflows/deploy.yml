# ─────────────────────────────────────────────────────────────────────────────
# CD Pipeline — Build, Push to ECR, and Deploy to AWS EC2 via SSH
# Triggers on: push to main, manual dispatch
# ─────────────────────────────────────────────────────────────────────────────
name: CD — Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── Build & Push All Container Images to ECR ──────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # Build and push backend services
      - name: Build & Push Services
        run: |
          SERVICES=(
            "discovery-service:autodeploy-discovery"
            "api-gateway:autodeploy-gateway"
            "auth-service:autodeploy-auth"
            "project-service:autodeploy-project"
            "build-service:autodeploy-build"
            "deployment-service:autodeploy-deployment"
            "domain-service:autodeploy-domain"
            "notification-service:autodeploy-notification"
          )
          for pair in "${SERVICES[@]}"; do
            IFS=':' read -r dir name <<< "$pair"
            echo "Building $name..."
            docker build -t "$ECR_REGISTRY/$name:${{ env.IMAGE_TAG }}" \
                         -t "$ECR_REGISTRY/$name:latest" \
                         -f "$dir/Dockerfile" .
            docker push "$ECR_REGISTRY/$name:${{ env.IMAGE_TAG }}"
            docker push "$ECR_REGISTRY/$name:latest"
          done

      # Build and push frontend
      - name: Build & Push Frontend
        run: |
          docker build -t "$ECR_REGISTRY/autodeploy-frontend:${{ env.IMAGE_TAG }}" \
                       -t "$ECR_REGISTRY/autodeploy-frontend:latest" \
                       --build-arg VITE_API_BASE_URL=https://api.autodeploy.space \
                       --build-arg VITE_WS_URL=wss://api.autodeploy.space \
                       --build-arg VITE_GITHUB_AUTH_URL=https://api.autodeploy.space/oauth2/authorization/github \
                       -f frontend/Dockerfile frontend/
          docker push "$ECR_REGISTRY/autodeploy-frontend:${{ env.IMAGE_TAG }}"
          docker push "$ECR_REGISTRY/autodeploy-frontend:latest"

  # ── Deploy to EC2 via SSH ──────────────────────────────────────────────────
  deploy-to-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/autodeploy

            # Login to ECR
            aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

            # Pull latest images
            sudo ECR_REGISTRY_URL=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com docker compose -f docker-compose.prod.yml pull

            # Restart containers with updated images
            sudo ECR_REGISTRY_URL=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com docker compose -f docker-compose.prod.yml up -d

            # Clean up dangling images
            sudo docker image prune -f
