server:
  port: 8083

spring:
  application:
    name: build-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:${POSTGRES_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/}${DB_NAME:build_db}}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://${RABBITMQ_USER:guest}:${RABBITMQ_PASSWORD:guest}@${RABBITMQ_HOST:localhost}:${RABBITMQ_PORT:5672}}
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual    # Manual ACK so we can NACK on processing failure
        concurrency: 2
        max-concurrency: 5
        prefetch: 1                 # One build at a time per consumer thread

  data:
    redis:
      url: ${REDIS_URL:redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://admin:admin@localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# ── AWS ───────────────────────────────────────────────────────────────────────
aws:
  region: ${AWS_REGION:us-east-1}
  endpoint-override: ${AWS_ENDPOINT_URL:}   # Set to http://localhost:4566 for LocalStack
  ecr:
    registry-url: ${ECR_REGISTRY_URL}
    repository: ${ECR_REPOSITORY_NAME:autodeploy}

# ── Build Settings ────────────────────────────────────────────────────────────
build:
  workspace-dir: ${BUILD_WORKSPACE_DIR:/tmp/autodeploy-builds}
  kaniko:
    executor-image: ${KANIKO_EXECUTOR_IMAGE:gcr.io/kaniko-project/executor:latest}
  max-concurrent-per-user: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.autodeploy: DEBUG
