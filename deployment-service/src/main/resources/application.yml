server:
  port: 8084

spring:
  application:
    name: deployment-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:${POSTGRES_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/}${DB_NAME:deployment_db}}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://${RABBITMQ_USER:guest}:${RABBITMQ_PASSWORD:guest}@${RABBITMQ_HOST:localhost}:${RABBITMQ_PORT:5672}}
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 2
        max-concurrency: 4
        prefetch: 1

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://admin:admin@localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# ── EC2 SSH ───────────────────────────────────────────────────────────────────
deploy:
  ssh:
    private-key-base64: ${EC2_SSH_PRIVATE_KEY_BASE64}
    username: ${EC2_SSH_USER:ec2-user}
    connection-timeout-ms: 10000
  container:
    memory-limit: ${CONTAINER_MEMORY_LIMIT:512m}
    cpu-limit: ${CONTAINER_CPU_LIMIT:0.5}
  health-check:
    retries: 10
    interval-ms: 5000

aws:
  region: ${AWS_REGION:us-east-1}
  endpoint-override: ${AWS_ENDPOINT_URL:}
  ecr:
    registry-url: ${ECR_REGISTRY_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.autodeploy: DEBUG
