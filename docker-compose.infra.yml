# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.infra.yml
# Starts ONLY infrastructure services: Postgres, Redis, RabbitMQ, LocalStack, Traefik.
# Use this when running microservices directly from your IDE.
#
#   docker-compose -f docker-compose.infra.yml up -d
# ─────────────────────────────────────────────────────────────────────────────



networks:
  autodeploy-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  localstack-data:
  traefik-certs:

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: autodeploy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # POSTGRES_DB intentionally NOT set — init.sql creates all service DBs
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - autodeploy-net

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: autodeploy-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - autodeploy-net

  # ── RabbitMQ ────────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: autodeploy-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI → http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - autodeploy-net

  # ── LocalStack (mocks ECR, Route53, S3) ────────────────────────────────────
  localstack:
    image: localstack/localstack:3
    container_name: autodeploy-localstack
    restart: unless-stopped
    environment:
      SERVICES: ecr,route53,s3,iam,sts
      DEBUG: 0
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      LOCALSTACK_AUTH_TOKEN: ""  # Community edition — leave blank
    ports:
      - "4566:4566"   # Unified LocalStack endpoint
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - autodeploy-net

  # ── Traefik v3 (Reverse Proxy / Load Balancer) ──────────────────────────────
  traefik:
    image: traefik:v3.1
    container_name: autodeploy-traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"                 # Dashboard (dev only — disable in prod)
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=autodeploy-net"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"   # Traefik dashboard → http://localhost:8080/dashboard/
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/certs
    networks:
      - autodeploy-net
