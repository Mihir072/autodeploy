# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.prod.yml — Production Stack for AWS EC2 Deployment
#
# Runs all infrastructure (Postgres, Redis, RabbitMQ) + all 8 microservices
# + Frontend + Traefik v3 edge reverse proxy with Let's Encrypt SSL.
#
# Costs: $0 for managed cloud DBs — everything runs self-hosted on your EC2 instance!
# ─────────────────────────────────────────────────────────────────────────────

networks:
  autodeploy-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  traefik-certs:
  build-workspace:

x-service-common: &service-common
  networks:
    - autodeploy-net
  restart: always
  env_file:
    - .env
  environment:
    JAVA_TOOL_OPTIONS: "-Xms32m -Xmx128m -XX:+UseG1GC"
    SPRING_PROFILES_ACTIVE: prod
    POSTGRES_URL: ${POSTGRES_URL:-jdbc:postgresql://postgres:5432/}
    DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/autodeploy}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    RABBITMQ_URL: ${RABBITMQ_URL:-amqp://${RABBITMQ_USER:-autodeploy}:${RABBITMQ_PASSWORD}@rabbitmq:5672}
    DB_HOST: postgres
    DB_PORT: 5432
    DB_USER: ${POSTGRES_USER:-postgres}
    DB_PASSWORD: ${POSTGRES_PASSWORD}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: 5672
    RABBITMQ_USER: ${RABBITMQ_USER:-autodeploy}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    EUREKA_URL: http://${EUREKA_USER:-admin}:${EUREKA_PASSWORD:-admin}@discovery-service:8761/eureka/
    AWS_REGION: ${AWS_REGION:-us-east-1}

services:

  # ── Traefik v3 (Edge Reverse Proxy & Auto SSL) ───────────────────────────────
  traefik:
    image: traefik:v3.1
    container_name: autodeploy-traefik
    restart: always
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=autodeploy-net"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@autodeploy.space}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/certs/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--log.level=INFO"
    environment:
      - DOCKER_API_VERSION=1.40
      - TRAEFIK_PROVIDERS_DOCKER_APIVERSION=1.40
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/certs
    networks:
      - autodeploy-net

  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: autodeploy-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - autodeploy-net

  # ── Redis 7 ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: autodeploy-redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - autodeploy-net

  # ── RabbitMQ 3.13 ────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: autodeploy-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-autodeploy}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - autodeploy-net

  # ── Discovery Service (Eureka) ───────────────────────────────────────────────
  discovery-service:
    build:
      context: .
      dockerfile: discovery-service/Dockerfile
    image: ${ECR_REGISTRY_URL:-autodeploy}/autodeploy-discovery:latest
    container_name: autodeploy-discovery
    <<: *service-common
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_USER: ${EUREKA_USER:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-admin}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── Auth Service ─────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    image: ${ECR_REGISTRY_URL:-autodeploy}/autodeploy-auth:latest
    container_name: autodeploy-auth
    <<: *service-common
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_NAME: auth_db
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-https://autodeploy.space}
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  # ── Project Service ──────────────────────────────────────────────────────────
  project-service:
    build:
      context: .
      dockerfile: project-service/Dockerfile
    image: ${ECR_REGISTRY_URL:-autodeploy}/autodeploy-project:latest
    container_name: autodeploy-project
    <<: *service-common
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_NAME: project_db
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-https://api.autodeploy.space}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  # ── Build Service ────────────────────────────────────────────────────────────
  build-service:
    build:
      context: .
      dockerfile: build-service/Dockerfile
    image: ${ECR_REGISTRY_URL:-autodeploy}/autodeploy-build:latest
    container_name: autodeploy-build
    <<: *service-common
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_NAME: build_db
      ECR_REGISTRY_URL: ${ECR_REGISTRY_URL}
      ECR_REPOSITORY_NAME: ${ECR_REPOSITORY_NAME:-autodeploy}
      BUILD_WORKSPACE_DIR: /tmp/autodeploy-builds
    volumes:
      - build-workspace:/tmp/autodeploy-builds
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  # ── Deployment Service ────────────────────────────────────────────────────────
  deployment-service:
    build:
      context: .
      dockerfile: deployment-service/Dockerfile
    image: ${ECR_REGISTRY_URL:-autodeploy}/autodeploy-deployment:latest
    container_name: autodeploy-deployment
    <<: *service-common
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_NAME: deployment_db
      EC2_SSH_PRIVATE_KEY_BASE64: ${EC2_SSH_PRIVATE_KEY_BASE64}
      EC2_SSH_USER: ${EC2_SSH_USER:-ec2-user}
      ECR_REGISTRY_URL: ${ECR_REGISTRY_URL}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  # ── Domain Service ────────────────────────────────────────────────────────────
  domain-service:
    build:
      context: .
      dockerfile: domain-service/Dockerfile
    image: ${ECR_REGISTRY_URL:-autodeploy}/autodeploy-domain:latest
    container_name: autodeploy-domain
    <<: *service-common
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_NAME: domain_db
      ROUTE53_HOSTED_ZONE_ID: ${ROUTE53_HOSTED_ZONE_ID}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-autodeploy.space}
      TRAEFIK_LB_IP: ${TRAEFIK_LB_IP}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  # ── Notification Service ───────────────────────────────────────────────────────
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    image: ${ECR_REGISTRY_URL:-autodeploy}/autodeploy-notification:latest
    container_name: autodeploy-notification
    <<: *service-common
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_NAME: notification_db
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@autodeploy.space}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  # ── API Gateway ────────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: ${ECR_REGISTRY_URL:-autodeploy}/autodeploy-gateway:latest
    container_name: autodeploy-gateway
    <<: *service-common
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://autodeploy.space,https://www.autodeploy.space}
    depends_on:
      redis:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-gateway.rule=Host(`api.autodeploy.space`)"
      - "traefik.http.routers.api-gateway.entrypoints=websecure"
      - "traefik.http.routers.api-gateway.tls.certresolver=letsencrypt"
      - "traefik.http.services.api-gateway.loadbalancer.server.port=8080"

  # ── Frontend (React + Nginx) ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://api.autodeploy.space
        VITE_WS_URL: wss://api.autodeploy.space
        VITE_GITHUB_AUTH_URL: https://api.autodeploy.space/oauth2/authorization/github
    image: ${ECR_REGISTRY_URL:-autodeploy}/autodeploy-frontend:latest
    container_name: autodeploy-frontend
    restart: always
    healthcheck:
      disable: true
    networks:
      - autodeploy-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`autodeploy.space`) || Host(`www.autodeploy.space`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
