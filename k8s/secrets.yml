# ─────────────────────────────────────────────────────────────────────────────
# Secret — Sensitive credentials (values are base64-encoded)
#
# DO NOT commit this file with real values.
# Use `kubectl create secret` or a secrets manager (AWS Secrets Manager / External Secrets Operator).
#
# To base64 encode a value:
#   echo -n "your_value" | base64
#
# To apply from command line instead of this file:
#   kubectl create secret generic autodeploy-secrets \
#     --namespace=autodeploy \
#     --from-literal=DB_USER=postgres \
#     --from-literal=DB_PASSWORD=your_password \
#     ...
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: autodeploy-secrets
  namespace: autodeploy
  labels:
    app.kubernetes.io/part-of: autodeploy-platform
type: Opaque
data:
  # Database
  DB_USER: cG9zdGdyZXM=                          # postgres
  DB_PASSWORD: REPLACE_WITH_BASE64_ENCODED_VALUE

  # RabbitMQ
  RABBITMQ_USER: REPLACE_WITH_BASE64_ENCODED_VALUE
  RABBITMQ_PASSWORD: REPLACE_WITH_BASE64_ENCODED_VALUE

  # Eureka
  EUREKA_USER: YWRtaW4=                          # admin
  EUREKA_PASSWORD: REPLACE_WITH_BASE64_ENCODED_VALUE

  # JWT
  JWT_SECRET: REPLACE_WITH_BASE64_ENCODED_VALUE

  # Encryption (AES-256)
  ENCRYPTION_KEY: REPLACE_WITH_BASE64_ENCODED_VALUE

  # GitHub OAuth
  GITHUB_CLIENT_ID: REPLACE_WITH_BASE64_ENCODED_VALUE
  GITHUB_CLIENT_SECRET: REPLACE_WITH_BASE64_ENCODED_VALUE
  GITHUB_WEBHOOK_SECRET: REPLACE_WITH_BASE64_ENCODED_VALUE

  # AWS
  AWS_ACCESS_KEY_ID: REPLACE_WITH_BASE64_ENCODED_VALUE
  AWS_SECRET_ACCESS_KEY: REPLACE_WITH_BASE64_ENCODED_VALUE

  # ECR
  ECR_REGISTRY_URL: REPLACE_WITH_BASE64_ENCODED_VALUE

  # Route53
  ROUTE53_HOSTED_ZONE_ID: REPLACE_WITH_BASE64_ENCODED_VALUE
  TRAEFIK_LB_IP: REPLACE_WITH_BASE64_ENCODED_VALUE

  # EC2 SSH Key (for deployment-service)
  EC2_SSH_PRIVATE_KEY_BASE64: REPLACE_WITH_BASE64_ENCODED_VALUE
  EC2_SSH_USER: ZWMyLXVzZXI=                     # ec2-user

  # Email (optional)
  MAIL_USERNAME: REPLACE_WITH_BASE64_ENCODED_VALUE
  MAIL_PASSWORD: REPLACE_WITH_BASE64_ENCODED_VALUE
  MAIL_FROM: REPLACE_WITH_BASE64_ENCODED_VALUE

  # Internal API Secret
  INTERNAL_API_SECRET: REPLACE_WITH_BASE64_ENCODED_VALUE
