# ─────────────────────────────────────────────────────────────────────────────
# Discovery Service (Eureka) — Kubernetes Deployment + Service
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
  namespace: autodeploy
  labels:
    app: discovery-service
    app.kubernetes.io/part-of: autodeploy-platform
spec:
  replicas: 1   # Eureka: single instance is fine for small clusters
  selector:
    matchLabels:
      app: discovery-service
  template:
    metadata:
      labels:
        app: discovery-service
    spec:
      containers:
        - name: discovery-service
          image: REPLACE_WITH_ECR_URL/autodeploy-discovery:latest
          ports:
            - containerPort: 8761
          envFrom:
            - configMapRef:
                name: autodeploy-config
            - secretRef:
                name: autodeploy-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-service
  namespace: autodeploy
  labels:
    app: discovery-service
spec:
  type: ClusterIP
  selector:
    app: discovery-service
  ports:
    - port: 8761
      targetPort: 8761
      protocol: TCP
