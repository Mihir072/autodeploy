# ─────────────────────────────────────────────────────────────────────────────
# Domain Service — Kubernetes Deployment + Service
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: domain-service
  namespace: autodeploy
  labels:
    app: domain-service
    app.kubernetes.io/part-of: autodeploy-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: domain-service
  template:
    metadata:
      labels:
        app: domain-service
    spec:
      containers:
        - name: domain-service
          image: REPLACE_WITH_ECR_URL/autodeploy-domain:latest
          ports:
            - containerPort: 8085
          env:
            - name: DB_NAME
              value: domain_db
          envFrom:
            - configMapRef:
                name: autodeploy-config
            - secretRef:
                name: autodeploy-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 90
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: domain-service
  namespace: autodeploy
  labels:
    app: domain-service
spec:
  type: ClusterIP
  selector:
    app: domain-service
  ports:
    - port: 8085
      targetPort: 8085
      protocol: TCP
