# ─────────────────────────────────────────────────────────────────────────────
# Project Service — Kubernetes Deployment + Service
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-service
  namespace: autodeploy
  labels:
    app: project-service
    app.kubernetes.io/part-of: autodeploy-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: project-service
  template:
    metadata:
      labels:
        app: project-service
    spec:
      containers:
        - name: project-service
          image: REPLACE_WITH_ECR_URL/autodeploy-project:latest
          ports:
            - containerPort: 8082
          env:
            - name: DB_NAME
              value: project_db
            - name: WEBHOOK_BASE_URL
              value: "https://api.autodeploy.space"
          envFrom:
            - configMapRef:
                name: autodeploy-config
            - secretRef:
                name: autodeploy-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 90
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: project-service
  namespace: autodeploy
  labels:
    app: project-service
spec:
  type: ClusterIP
  selector:
    app: project-service
  ports:
    - port: 8082
      targetPort: 8082
      protocol: TCP
